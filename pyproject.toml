[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brainiac"
version = "0.2.0"
description = "Self-hostable agentic platform for generating, validating, backtesting and evolving quantitative alphas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brainiac contributors" }]
keywords = ["quant", "alpha", "trading", "backtesting", "llm", "agents", "fastexpr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]
llm = [
  "openai>=1.30",
  "httpx>=0.27",
]
parse = [
  "pymupdf>=1.24",
  "llama-parse>=0.4",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
  "pandas-stubs>=2.1",
  "httpx>=0.27",
]
all = ["brainiac[server,llm,parse]"]

[project.scripts]
brainiac = "brainiac.cli:main"

[project.urls]
Homepage = "https://github.com/jdhruv1503/Brainiac"
Repository = "https://github.com/jdhruv1503/Brainiac"
Issues = "https://github.com/jdhruv1503/Brainiac/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/brainiac"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "brainiac/knowledge"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "PTH",  # flake8-use-pathlib
  "TID",  # flake8-tidy-imports
  "ASYNC",
  "S",    # flake8-bandit
]
ignore = [
  "S101",  # assert is fine (tests, invariants)
  "B008",  # FastAPI/typer rely on calls in defaults
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/brainiac/search/**" = ["S311"]  # PRNG is for search, not crypto
"src/brainiac/data/synthetic.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["brainiac"]

[tool.mypy]
python_version = "3.11"
packages = ["brainiac"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_parse.*", "fitz.*", "openai.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "slow: long-running tests",
  "network: requires network access (skipped by default in CI)",
]
filterwarnings = ["error::DeprecationWarning:brainiac.*"]

[tool.coverage.run]
source = ["src/brainiac"]
branch = true
omit = ["*/api/dashboard.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
